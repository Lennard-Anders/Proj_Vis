name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint_py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r etl/requirements.txt -r ml/requirements.txt
          pip install black ruff mypy pytest
      - name: Lint
        run: |
          black --check backend ml etl
          ruff backend ml etl
          mypy backend/app
      - name: Tests
        run: pytest -q backend

  lint_ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run

  build_images:
    runs-on: ubuntu-latest
    needs: [lint_py, lint_ts]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository }}/backend:ci backend
      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository }}/frontend:ci frontend
      - name: Push images
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:ci
          docker push ghcr.io/${{ github.repository }}/frontend:ci

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build_images
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests
        run: |
          ls infra/k8s
      - name: Kubectl apply
        run: echo "Skipping deploy in template pipeline"
