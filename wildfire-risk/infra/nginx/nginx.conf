# infra/nginx/nginx.conf

# Basic Nginx setup
events {
  worker_connections 1024;
}

http {
  # ✅ Ensure correct MIME types are loaded (fixes .js served as text/plain)
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;

  # Optional: enable gzip compression for static assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  server {
    listen 80;
    server_name _;

    # Root directory for built frontend files (mounted via volume)
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html for all non-file paths
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
      proxy_pass http://backend:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
    }

    # Prometheus endpoint for Nginx metrics
    location /stub_status {
      stub_status;
      access_log off;
    }

    # Log files for debugging and metrics
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
  }
}
