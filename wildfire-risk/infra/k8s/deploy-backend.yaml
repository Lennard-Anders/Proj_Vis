apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wildfire-risk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ORG/wildfire-backend:main
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_BUNDLE_PATH
              value: /app/models/bundles/current
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wildfire-risk
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
