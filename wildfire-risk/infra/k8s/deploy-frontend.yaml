apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wildfire-risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ORG/wildfire-frontend:main
          ports:
            - containerPort: 4173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wildfire-risk
spec:
  selector:
    app: frontend
  ports:
    - port: 4173
      targetPort: 4173
      name: http
