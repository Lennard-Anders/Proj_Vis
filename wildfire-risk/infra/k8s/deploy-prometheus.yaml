apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: wildfire-risk
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: backend
        static_configs:
          - targets: ['backend:8000']
      - job_name: nginx
        static_configs:
          - targets: ['nginx:80']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: wildfire-risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: wildfire-risk
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
